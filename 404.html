<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snowed in — UB Subject Advisor</title><meta name="theme-color" content="#005bbb">
<style>
@font-face{font-family:"Source Serif 4";font-weight:200 900;src:url(assets/fonts/source-serif-4-latin-wght-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:100 900;src:url(assets/fonts/inter-latin-wght-normal.woff2) format("woff2")}
html,body{height:100%;margin:0}
body{font-family:Inter,system-ui,sans-serif;color:#fff;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box;overflow:hidden;
 background:radial-gradient(900px 500px at 80% -10%,#2f80d6,transparent 60%),linear-gradient(160deg,#00408a,#005bbb 55%,#0a66c9)}
canvas{position:fixed;inset:0;pointer-events:none}
.k{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#ffc72c;font-weight:700;margin:0 0 10px}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(44px,9vw,96px);line-height:1;margin:0 0 14px;letter-spacing:-.02em}
p{max-width:460px;margin:0 auto 26px;opacity:.9;line-height:1.6;font-size:17px}
a{display:inline-block;background:#ffc72c;color:#002f56;font-weight:700;padding:13px 22px;border-radius:10px;text-decoration:none;box-shadow:0 8px 20px rgba(0,0,0,.2)}
a:hover{background:#ffd457}
</style></head>
<body><canvas id="s"></canvas><main><p class="k">Error 404 · Lake-effect advisory</p><h1>Snowed in.</h1><p>This page is buried under a Buffalo-sized snowdrift. Even the Stampede can’t get through.</p><a href="./">Dig out — back to the advisor</a></main>
<script>
const c=document.getElementById("s"),x=c.getContext("2d");let W,H;const r=()=>{W=c.width=innerWidth;H=c.height=innerHeight};r();addEventListener("resize",r);
const F=Array.from({length:180},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.8,v:.6+Math.random()*1.6,s:Math.random()*6}));
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
(function f(){x.clearRect(0,0,W,H);x.fillStyle="rgba(255,255,255,.9)";for(const p of F){if(!still){p.y+=p.v;p.s+=.02;p.x+=Math.sin(p.s)*.7;if(p.y>H+5){p.y=-5;p.x=Math.random()*W}}x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}if(!still)requestAnimationFrame(f)})();
</script></body></html>
